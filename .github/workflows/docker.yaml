name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    # 增加可用磁盘空间
    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Install skopeo & jq
      run: |
        sudo apt update
        sudo apt install -y skopeo jq

    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Sync multi-arch images to Aliyun ACR
      run: |
        DEST_CREDS="${ALIYUN_REGISTRY_USER}:${ALIYUN_REGISTRY_PASSWORD}"

        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
            
            # 获取镜像的完整名称，例如kasmweb/nginx:1.25.3（命名空间/镜像名:版本号）
            image=$(echo "$line" | awk '{print $NF}')
            # 将@sha256:等字符删除
            image="${image%%@*}"
            echo "image $image"
            # 获取镜像名:版本号  例如nginx:1.25.3
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            # 获取命名空间 例如kasmweb,  这里有种特殊情况 docker.io/nginx，把docker.io当成命名空间，也OK
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            # 这里不要是空值影响判断
            name_space="${name_space}_"
            # 获取镜像名例如nginx
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"
            
            # 如果镜像存在于数组中，则添加temp_map
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 # 如果temp_map已经存在镜像名，判断是不是同一命名空间
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                # 存镜像的命名空间
                temp_map[$image_name]=$name_space
            fi       
        done < images.txt
        
        
        while IFS= read -r line || [ -n "$line" ]; do
            # 忽略空行与注释
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then
                continue
            fi
        
            echo "===== Source line: $line ====="
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            echo "source image: $image"

            # 获取 镜像名:版本号
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            # 获取命名空间
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            # 获取镜像名
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
        
            name_space_prefix=""
            # 如果镜像名重名
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               #如果命名空间非空，将命名空间加到前缀
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi
            
            image_name_tag="${image_name_tag%%@*}"
            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${name_space_prefix}${image_name_tag}"
            echo "target aliyun image: $new_image"

            SOURCE_IMG_RAW="${image}"
            SOURCE_REPO=$(echo "${SOURCE_IMG_RAW}" | cut -d: -f1)
            SOURCE_IMG_PREFIX="docker://${SOURCE_REPO}"
            TARGET_IMG="docker://${new_image}"

            # 获取源manifest，过滤掉OCI empty
            skopeo inspect --raw docker://${SOURCE_IMG_RAW} > source_manifest.json
            DIGESTS=$(jq -r '.manifests[] | select(.mediaType!="application/vnd.oci.empty.v1+json") | .digest' source_manifest.json)
            echo "有效digest: $DIGESTS"

            # 逐个复制每个架构镜像层
            for dg in $DIGESTS; do
              echo "Copy ${SOURCE_IMG_PREFIX}@$dg ==> ${TARGET_IMG}@$dg"
              skopeo copy --retry-times 3 \
                --dest-creds $DEST_CREDS \
                ${SOURCE_IMG_PREFIX}@${dg} \
                ${TARGET_IMG}@${dg}
            done

            # 在阿里云重建多架构manifest
            skopeo manifest create ${TARGET_IMG} $(echo $DIGESTS | sed "s# # ${TARGET_IMG}@#g" | sed "s#^#${TARGET_IMG}@#") --amend

            # 校验
            skopeo inspect --raw ${TARGET_IMG} > final.json
            cat final.json
            if jq -e '.manifests' final.json >/dev/null;then
              echo "✅ multi arch ok"
            else
              echo "❌ manifest build error"
              exit 1
            fi
            rm -f source_manifest.json final.json
        done < images.txt
