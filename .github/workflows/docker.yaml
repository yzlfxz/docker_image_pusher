name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]


env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

  build:
    name: Pull
    runs-on: ubuntu-latest
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Maximize build space
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 128
        remove-dotnet: 'true'
        remove-haskell: 'true'
        build-mount-path: '/var/lib/docker/'

    - name: Install skopeo & jq
      run: |
        sudo apt update
        sudo apt install -y skopeo jq

    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Sync multi-arch images to Aliyun ACR
      run: |
        DEST_CREDS="${ALIYUN_REGISTRY_USER}:${ALIYUN_REGISTRY_PASSWORD}"

        declare -A duplicate_images
        declare -A temp_map
        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then continue; fi
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            echo "image $image"
            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            echo "image_name_tag $image_name_tag"
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            echo "name_space: $name_space"
            name_space="${name_space}_"
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')
            echo "image_name: $image_name"
            if [[ -n "${temp_map[$image_name]}" ]]; then
                 if [[ "${temp_map[$image_name]}" != $name_space  ]]; then
                    echo "duplicate image name: $image_name"
                    duplicate_images[$image_name]="true"
                 fi
            else
                temp_map[$image_name]=$name_space
            fi
        done < images.txt


        while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" ]] && continue
            if echo "$line" | grep -q '^\s*#'; then continue; fi
            echo "===== Source line: $line ====="
            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"
            echo "source image: $image"

            image_name_tag=$(echo "$image" | awk -F'/' '{print $NF}')
            name_space=$(echo "$image" | awk -F'/' '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')
            image_name=$(echo "$image_name_tag" | awk -F':' '{print $1}')

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]}" ]]; then
               if [[ -n "${name_space}" ]]; then
                  name_space_prefix="${name_space}_"
               fi
            fi

            image_name_tag="${image_name_tag%%@*}"
            new_image_full="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/${name_space_prefix}${image_name_tag}"
            new_repo="${new_image_full%:*}"
            echo "target full(with tag): $new_image_full"
            echo "target repo(no tag): $new_repo"

            SOURCE_IMG_RAW="${image}"
            SOURCE_REPO=$(echo "${SOURCE_IMG_RAW}" | cut -d: -f1)
            SOURCE_IMG_PREFIX="docker://${SOURCE_REPO}"

            skopeo inspect --raw docker://${SOURCE_IMG_RAW} > source_manifest.json

            # 输出manifest数组，循环读取每一条
            manifests=$(jq -c '.manifests[]' source_manifest.json)
            selected_digests=()

            while IFS= read -r entry; do
                digest=$(echo "$entry" | jq -r '.digest')
                mediaType=$(echo "$entry" | jq -r '.mediaType')
                platform=$(echo "$entry" | jq -c '.platform')
                echo "Check entry digest=$digest mediaType=$mediaType platform=$platform"

                if [[ "$mediaType" == "application/vnd.oci.empty.v1+json" ]];then
                    echo "👉 Skip OCI empty manifest, do NOT copy"
                    continue
                fi
                echo "✅ Accept this manifest, start copy"
                skopeo copy --retry-times 3 \
                  --dest-creds $DEST_CREDS \
                  ${SOURCE_IMG_PREFIX}@${digest} \
                  docker://${new_repo}@${digest}
                selected_digests+=("docker://${new_repo}@${digest}")
            done <<< "$manifests"

            echo "Collected digests for manifest list: ${selected_digests[*]}"
            if [[ ${#selected_digests[@]} -eq 0 ]];then
                echo "❌ No valid manifest found!"
                exit 1
            fi

            TARGET_FULL="docker://${new_image_full}"
            skopeo manifest create ${TARGET_FULL} "${selected_digests[@]}" --amend

            skopeo inspect --raw ${TARGET_FULL} > final.json
            cat final.json
            if jq -e '.manifests' final.json >/dev/null;then
              echo "✅ multi arch ok"
            else
              echo "❌ manifest build error"
              exit 1
            fi
            rm -f source_manifest.json final.json
        done < images.txt
